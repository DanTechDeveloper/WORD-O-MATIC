name: Build Verification & Live Production Migration

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: # manual runs: enables the gated Railway migration step

defaults:
  run:
    working-directory: my-app

jobs:
  build-verify-and-migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          # zip + gd: required by maatwebsite/excel (phpspreadsheet)
          extensions: mbstring, xml, ctype, iconv, mysql, bcmath, sqlite, pdo_sqlite, zip, gd

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      # STEP 1: I-test muna ang code gamit ang SQLite para ligtas ang live database
      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

      - name: Run Test Migrations
        run: php artisan migrate --force

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install & Build Frontend
        run: |
          npm install
          npm run build

      - name: Run Tests
        run: php artisan test

      # STEP 2: Manual-only while Railway is paused (expired trial) — restore
      # the DB + secrets, then run this workflow via workflow_dispatch.
      - name: Run Live Production Migration on Railway
        if: github.event_name == 'workflow_dispatch'
        env:
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.RAILWAY_DB_HOST }}
          DB_PORT: ${{ secrets.RAILWAY_DB_PORT }}
          DB_DATABASE: ${{ secrets.RAILWAY_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.RAILWAY_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.RAILWAY_DB_PASSWORD }}
        run: |
          php artisan migrate --force