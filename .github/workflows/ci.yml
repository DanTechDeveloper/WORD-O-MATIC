name: Build Verification & Live Production Migration

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: # manual runs: enables gated Aiven sfo migration — GO A

defaults:
  run:
    working-directory: my-app

jobs:
  build-verify-and-migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: wordomatic_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -psecret" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          # zip + gd: required by maatwebsite/excel (phpspreadsheet)
          extensions: mbstring, xml, ctype, iconv, mysql, bcmath, sqlite, pdo_sqlite, zip, gd

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      # STEP 1: I-test muna ang code gamit ang SQLite para ligtas ang live database
      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

      - name: Run Test Migrations
        run: php artisan migrate --force

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install & Build Frontend
        run: |
          npm install
          npm run build

      - name: Run Tests
        run: php artisan test

      - name: Run JS unit tests
        run: npx vitest run

      # ponytail: auto-prune VCR keep last 5 via OIDC (no vcp_/vercel_ long-lived) — vercel.com/docs/container-registry/github-actions
      - name: Log in to VCR (OIDC, no long-lived token)
        if: vars.VERCEL_TEAM_ID != '' || secrets.VERCEL_TEAM_ID != ''
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID || secrets.VERCEL_TEAM_ID }}
        continue-on-error: true

      - name: Prune VCR keep last 5 (unblock registry quota)
        if: vars.VERCEL_TEAM_ID != '' || secrets.VERCEL_TEAM_ID != ''
        continue-on-error: true
        run: |
          vercel vcr image ls app --project word-o-matic --format json > /tmp/vcr.json 2>&1 || { echo "No VCR images, skip"; cat /tmp/vcr.json; exit 0; }
          jq -r '.[].id // empty' /tmp/vcr.json | tail -n +6 > /tmp/old.txt || true
          if [ -s /tmp/old.txt ]; then echo "Pruning $(wc -l < /tmp/old.txt) old images..."; while read id; do echo "rm $id"; vercel vcr image rm app --project word-o-matic "$id" --yes || true; done < /tmp/old.txt; else echo "No old images to prune (<=5)"; fi

      - name: Vercel build smoke - Caddy immutable headers
        run: grep -q 'immutable' Caddyfile && echo "Caddy immutable OK"

      - name: Run MySQL index tests (Branch C)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wordomatic_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: |
          php artisan migrate:fresh --force
          php artisan test --filter=IndexesExistTest

      # STEP 2: Manual-only — Aiven sfo (was Railway paused) — ponytail: GO A migrate:fresh --seed, 15-25s sfo
      - name: Run Live Production Migration on Aiven
        if: github.event_name == 'workflow_dispatch'
        env:
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.AIVEN_DB_HOST || secrets.RAILWAY_DB_HOST || secrets.DB_HOST }}
          DB_PORT: ${{ secrets.AIVEN_DB_PORT || secrets.RAILWAY_DB_PORT || secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.AIVEN_DB_DATABASE || secrets.RAILWAY_DB_DATABASE || secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.AIVEN_DB_USERNAME || secrets.RAILWAY_DB_USERNAME || secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD || secrets.RAILWAY_DB_PASSWORD || secrets.DB_PASSWORD }}
        run: |
          php artisan migrate:fresh --seed --force