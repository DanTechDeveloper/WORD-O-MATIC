name: Build Verification & Live Production Migration

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

defaults:
  run:
    working-directory: my-app

jobs:
  build-verify-and-migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ponytail: prune VCR keep last 5 to avoid "maximum allowed number of images" buildah push 125
      - name: Prune VCR (keep last 5 images)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN not set, skip VCR prune"; exit 0; fi
          npm i -g vercel@latest > /dev/null 2>&1
          echo "Listing VCR images for app..."
          vercel vcr image ls app --project word-o-matic --format json > /tmp/vcr.json 2>&1 || { echo "No VCR images or not linked, skip"; cat /tmp/vcr.json; exit 0; }
          # Keep newest 5, delete oldest (order is newest first per docs sort updatedAt desc)
          jq -r '.[].id // empty' /tmp/vcr.json | tail -n +6 > /tmp/old.txt || true
          if [ -s /tmp/old.txt ]; then
            echo "Pruning $(wc -l < /tmp/old.txt) old images..."
            while read id; do echo "rm $id"; vercel vcr image rm app --project word-o-matic "$id" --yes || true; done < /tmp/old.txt
          else
            echo "No old images to prune (<=5 total)"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, mysql, bcmath, sqlite, pdo_sqlite

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      # STEP 1: I-test muna ang code gamit ang SQLite para ligtas ang live database
      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

      - name: Run Test Migrations
        run: php artisan migrate --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend
        run: |
          npm install
          npm run build

      - name: Run Tests
        run: php artisan test

      # STEP 2: Kapag nakapasa sa test, i-inject ang live Railway credentials at mag-migrate
      - name: Run Live Production Migration on Railway
        env:
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.RAILWAY_DB_HOST }}
          DB_PORT: ${{ secrets.RAILWAY_DB_PORT }}
          DB_DATABASE: ${{ secrets.RAILWAY_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.RAILWAY_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.RAILWAY_DB_PASSWORD }}
        run: |
          php artisan migrate --force